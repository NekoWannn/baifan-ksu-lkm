name: Build Baifan KSU LKM

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kernelsu.ko (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android15-6.6
          - android16-6.12
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build kernelsu.ko
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd kernel

          CONFIG_KSU=m CC=clang make \
            KSU_EXPECTED_SIZE=0x0339 \
            KSU_EXPECTED_HASH=bad08be1f8e813067892adca0e70452cd645ba31e5ed15bec35e60fa430f2f48 \
            KSU_EXPECTED_SIZE2=0x033b \
            KSU_EXPECTED_HASH2=c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6 \
            KSU_MANAGER_PACKAGE=me.weishu.kernelsu

          OUT="$GITHUB_WORKSPACE/kernelsu-${{ matrix.kmi }}-baifan.ko"
          cp kernelsu.ko "$OUT"
          llvm-strip -d "$OUT" || true
          ls -lh "$OUT"

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-${{ matrix.kmi }}-baifan
          path: kernelsu-${{ matrix.kmi }}-baifan.ko
